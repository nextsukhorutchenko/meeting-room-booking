services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  setup:
    build:
      context: .
      target: setup
    environment:
      APP_URL: ${APP_URL}
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE}
      AUTH_CLIENT_IP_HEADER: ${AUTH_CLIENT_IP_HEADER}
      AUTH_LOGIN_IDENTITY_LIMIT: ${AUTH_LOGIN_IDENTITY_LIMIT}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_REGISTER_IDENTITY_LIMIT: ${AUTH_REGISTER_IDENTITY_LIMIT}
      AUTH_REGISTER_IP_LIMIT: ${AUTH_REGISTER_IP_LIMIT}
      AUTH_REQUEST_BODY_MAX_BYTES: ${AUTH_REQUEST_BODY_MAX_BYTES}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES}
      NOTIFICATION_LEASE_SECONDS: ${NOTIFICATION_LEASE_SECONDS}
      OFFICE_CLOSE_HOUR: ${OFFICE_CLOSE_HOUR}
      OFFICE_OPEN_HOUR: ${OFFICE_OPEN_HOUR}
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE}
      SESSION_DAYS: ${SESSION_DAYS}
      VERIFICATION_DELIVERY_MODE: ${VERIFICATION_DELIVERY_MODE}
      VERIFICATION_WEBHOOK_BEARER_TOKEN: ${VERIFICATION_WEBHOOK_BEARER_TOKEN:-}
      VERIFICATION_WEBHOOK_URL: ${VERIFICATION_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      APP_URL: ${APP_URL}
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE}
      AUTH_CLIENT_IP_HEADER: ${AUTH_CLIENT_IP_HEADER}
      AUTH_LOGIN_IDENTITY_LIMIT: ${AUTH_LOGIN_IDENTITY_LIMIT}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_REGISTER_IDENTITY_LIMIT: ${AUTH_REGISTER_IDENTITY_LIMIT}
      AUTH_REGISTER_IP_LIMIT: ${AUTH_REGISTER_IP_LIMIT}
      AUTH_REQUEST_BODY_MAX_BYTES: ${AUTH_REQUEST_BODY_MAX_BYTES}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES}
      NOTIFICATION_LEASE_SECONDS: ${NOTIFICATION_LEASE_SECONDS}
      OFFICE_CLOSE_HOUR: ${OFFICE_CLOSE_HOUR}
      OFFICE_OPEN_HOUR: ${OFFICE_OPEN_HOUR}
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE}
      SESSION_DAYS: ${SESSION_DAYS}
      VERIFICATION_DELIVERY_MODE: ${VERIFICATION_DELIVERY_MODE}
      VERIFICATION_WEBHOOK_BEARER_TOKEN: ${VERIFICATION_WEBHOOK_BEARER_TOKEN:-}
      VERIFICATION_WEBHOOK_URL: ${VERIFICATION_WEBHOOK_URL:-}
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
